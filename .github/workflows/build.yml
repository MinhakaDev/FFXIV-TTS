name: Build binaries

# Every push to main publishes a release with the next patch version, so there is no
# need to create tags by hand. Add "[skip ci]" to a commit message to skip a build
# (useful for README-only changes). Manual runs build artifacts without releasing.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

# One run at a time. The next version comes from the tags that exist when a run starts,
# so two overlapping runs both released the same version and the later one overwrote the
# first one's zips. A queued run waits for the one in progress; if pushes pile up, GitHub
# keeps only the newest queued run, which builds main with all of them in it.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # tags are needed to work out the current version

      - name: Work out the next version
        id: next
        run: |
          # A tag already on this commit wins, so a minor/major bump is just
          # "git tag v0.2.0 && git push origin v0.2.0" before pushing main.
          pinned=$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)
          if [ -n "$pinned" ]; then
            echo "tag=$pinned" >> "$GITHUB_OUTPUT"
            echo "Commit is already tagged. Releasing: $pinned"
            exit 0
          fi

          # Only plain vX.Y.Z tags count. A looser glob also matches a pre-release tag like
          # v1.0.0-rc1, which sorts last and whose "0-rc1" patch breaks the arithmetic below.
          latest=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)
          if [ -z "$latest" ]; then
            next="v0.1.0"
          else
            IFS=. read -r major minor patch <<< "${latest#v}"
            next="v$major.$minor.$((patch + 1))"
          fi
          echo "tag=$next" >> "$GITHUB_OUTPUT"
          echo "Latest tag: ${latest:-none}. Releasing: $next"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: ffxiv-tts-linux
          - os: windows-latest
            artifact_name: ffxiv-tts-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Linux audio libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y portaudio19-dev libsndfile1

      - name: Free disk space
        if: runner.os == 'Linux'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Build executables
        shell: bash
        run: |
          pip install -r requirements.txt -r requirements-build.txt
          python -m spacy download en_core_web_sm
          # Stamp the version into the binary so it can check for updates. A manual run
          # releases nothing, so it gets a -test suffix: it mustn't claim a number a later
          # release will use, and like a dev build's version the suffix keeps the check off.
          version="${{ needs.version.outputs.tag }}"
          if [ "${{ github.event_name }}" != "push" ]; then version="$version-test"; fi
          printf '__version__ = "%s"\n' "$version" > src/version.py
          pyinstaller --noconfirm ffxiv-tts.spec
          # No settings/ here: the binary carries its defaults and merges them into the
          # user's own settings/ when it starts, so unzipping an update keeps them. The
          # Name screen's lexicon is the user's too, so it stays out of the zip as well.
          cp -r lexicons dist/lexicons
          rm dist/lexicons/Your-Name/lexicon.pls

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/

  release:
    needs: [version, build]
    # Manual runs are for testing a build, so they stop at downloadable artifacts.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Zip release assets
        run: |
          # upload-artifact doesn't keep file permissions, so the Linux binary comes back
          # without its execute bit. Restore it, or the app won't run once unzipped.
          chmod +x artifacts/ffxiv-tts-linux/ffxiv-tts
          cd artifacts/ffxiv-tts-linux && zip -r ../../ffxiv-tts-linux.zip . && cd -
          cd artifacts/ffxiv-tts-windows && zip -r ../../ffxiv-tts-windows.zip . && cd -

      # Creates the tag as well as the release, so no tag push is needed here - which
      # also means this workflow can't retrigger itself. target_commitish puts the tag on
      # the commit this run built. Without it GitHub tags main as it is when this step
      # runs, and a push during the build may have moved it on.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.version.outputs.tag }}
          generate_release_notes: true
          files: |
            ffxiv-tts-linux.zip
            ffxiv-tts-windows.zip
